# Blocks commits that contain secrets (AWS keys, tokens, private keys).
# Setup once:  brew install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.38.0
    hooks:
      - id: cfn-lint
        files: ^infra/.*\.yaml$
